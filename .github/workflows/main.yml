name: Build TouhouLittleMaid-GTNH

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Minecraft 1.7.10 Mod
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          architecture: x64

      - name: Set up Gradle 4.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.4.1'

      - name: Show Java and Gradle versions
        run: |
          java -version
          gradle --version

      - name: Prepare ForgeGradle workspace
        run: gradle setupCIWorkspace --no-daemon

      - name: Build mod
        run: gradle build --no-daemon

      - name: List build output
        if: always()
        run: |
          echo "===== build/libs ====="
          ls -lah build/libs || true
          echo "===== build ====="
          find build -maxdepth 3 -type f | sort | head -200 || true

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: TouhouLittleMaid-GTNH
          path: build/libs/*.jar
          if-no-files-found: error
